schema_version: "2.1"

component:
  type: service
  id: goreecloud-gateway
  product_name: GoreeCloud Gateway
  repository: GoreeCloud/gateway

lifecycle: forge
lifecycle_metadata:
  flags:
    - blocked
    - migration-required
  deployment_state: development
  qualification_state: in-progress
  next_gate: weave
  candidate_identity: null
  last_transition: null
  evidence: []
version: unreleased-development

supported_platforms:
  - linux

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Manager operational visibility and lifecycle administration are applicable, but no accepted Manager integration exists for this Development candidate.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Privacy-minimized logging and evidence are required for Stable qualification, but Privacy Shield integration and runtime acceptance remain incomplete.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/security/request-header-policy.md
    notes: The Development candidate contains fail-closed forwarding-identity controls and other security foundations, but Wardveil Security integration and target-environment acceptance remain incomplete.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/recovery.md
    notes: Native configuration snapshot, restore, and rollback primitives exist in Development, but Everkeep integration and production-representative recovery acceptance remain incomplete.
  gc_ui:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: GoreeCloud UI (GC UI) is the sole active design-system authority. Foundations 1.0.1 has limited scope; the broader GC UI workspace remains experimental/alpha. No accepted Gateway administration application or end-to-end GC UI integration exists for this Development candidate.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Governed cross-service discovery and coordination are applicable where required, but no accepted GoreeCloud Mesh runtime integration exists for this candidate.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: GoreeCloud Identity must own approved administrative identity and authentication; no accepted Gateway Identity integration exists for this candidate.
  policy:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Gateway route, exposure, TLS, forwarding-trust, and administrative decisions require governed Policy integration, but no accepted GoreeCloud Policy decision or enforcement integration exists for this candidate.
  observability:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Operational health, privacy-minimized metrics, diagnostics, dependency health, freshness, and provenance are applicable, but no accepted GoreeCloud Observability integration exists for this candidate.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect canonical Gateway configuration, service, route, backend, certificate-policy metadata, and known-good state through the approved Everkeep recovery model.
      - Exclude reusable credentials, private keys, and certificate private material from ordinary portable evidence unless an explicitly protected recovery mechanism requires them.
  restore:
    required: true
    requirements:
      - Validate restore into an isolated environment before production qualification.
      - Verify restored routing intent, listener ownership boundaries, TLS policy, backend references, and known-good rollback state for the exact candidate.
  export:
    required: true
    requirements:
      - Provide documented, bounded export of Gateway configuration and migration-relevant state without leaking reusable credentials or private key material.
  portability:
    required: true
    requirements:
      - Keep durable Gateway configuration and migration evidence in versioned GoreeCloud-owned formats that can be restored or transformed without permanent dependence on a complete third-party gateway product.

external_dependencies: []

compatibility:
  platform_contract: "2.1"
  gc_ui_required: "foundations-v1.0.1"
  requires:
    - goreecloud-platform-contract==2.1
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - FEATURES.md
  blockers:
    - The native Gateway runtime is merged in Development but has not been accepted as production authority on the target VPS.
    - Caddy remains production-authoritative and no production listener-ownership transfer or cutover is authorized.
    - GoreeCloud Manager integration and acceptance are incomplete.
    - Privacy Shield integration and acceptance are incomplete.
    - Wardveil Security integration and target-environment security acceptance are incomplete.
    - Everkeep integration and production-representative backup, restore, recovery, and rollback acceptance are incomplete.
    - GoreeCloud UI administration implementation, integration conformance, and application acceptance are incomplete; limited Foundations 1.0.1 availability does not establish Gateway UI readiness.
    - GoreeCloud Mesh integration and acceptance are incomplete.
    - GoreeCloud Identity integration and acceptance are incomplete.
    - GoreeCloud Policy decision, enforcement, and evidence acceptance are incomplete.
    - GoreeCloud Observability health, telemetry, diagnostics, freshness, and evidence acceptance are incomplete.
    - Exact-artifact target-VPS Caddy parity, certificate, listener, WebSocket or upgrade, load, recovery, rollback, and production-acceptance evidence is incomplete.
    - No Stable or production-approved Gateway release evidence is declared.
