name: Gateway Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Unit test
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity, permissions, and provenance
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/gateway-apk-badging.txt"
          grep -q "package: name='com.goreecloud.gateway' versionCode='1' versionName='0.1.0'" "$RUNNER_TEMP/gateway-apk-badging.txt"
          grep -q "sdkVersion:'26'" "$RUNNER_TEMP/gateway-apk-badging.txt"
          grep -q "targetSdkVersion:'35'" "$RUNNER_TEMP/gateway-apk-badging.txt"
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse("android/app/src/main/AndroidManifest.xml").getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          assert app is not None and app.get(ns + "allowBackup") == "false"
          assert app.get(ns + "usesCleartextTraffic") == "false"
          permissions = [p.get(ns + "name") for p in root.findall("uses-permission")]
          assert permissions == ["android.permission.INTERNET"], permissions
          PY
          printf "Verified Android debug APK identity and permissions\n"
          sha256sum "$apk"
      # Internal, ephemeral CI transfer container only. Not a user-deliverable APK.
      # GoreeCloud requires the extracted, standalone APK in Drive GoreeCloud/Artifacts.
      - name: Retain temporary test APK for controlled Drive delivery
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-gateway-android-debug-candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
