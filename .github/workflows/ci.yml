name: Gateway CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official Node 24 action
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, verified official Node 24 action
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build web console
        run: npm ci --prefix web --ignore-scripts && npm run build --prefix web
      - name: Install isolated Chromium for keyboard and UI regression tests
        run: npm exec --prefix web -- playwright install --with-deps chromium
      - name: Browser keyboard and mobile accessibility checks (synthetic API)
        run: npm run test:e2e --prefix web -- --project=chromium
      - name: Audit pinned web dependencies
        run: npm audit --prefix web --audit-level=high
      - name: Redacted preflight synthetic tests (no Docker contact)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0, verified official Node 24 action
        with:
          # go.mod declares API compatibility minimum (1.26), not a patched
          # security toolchain. Pin a verified current version for CI so that
          # govulncheck checks real standard-library security fixes too.
          go-version: '1.27.4'
          cache: true
      - name: Go tests and vet
        run: go test -count=1 ./... && go vet ./...
      - name: Check reachable Go vulnerability advisories
        env:
          GOTELEMETRY: 'off'
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$RUNNER_TEMP/govulncheck" -mode=source ./...
      - name: Native build
        run: CGO_ENABLED=0 go build -trimpath -o gateway .
      - name: Cross-compile Linux ARM64 native engine (no emulation or execution)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go build -trimpath -o gateway-linux-arm64 .
          test -s gateway-linux-arm64
          file gateway-linux-arm64 | grep -E 'ELF 64-bit.*aarch64|ELF 64-bit.*ARM aarch64'
          go version -m gateway-linux-arm64 | grep -F 'GOARCH=arm64'
          go version -m gateway-linux-arm64 | grep -F 'github.com/caddyserver/caddy/v2'
          go version -m gateway-linux-arm64 | grep -F 'github.com/caddy-dns/porkbun'
      - name: Confirm Caddy modules are available
        run: |
          ./gateway list-modules | grep -F http.handlers.reverse_proxy
          ./gateway list-modules | grep -F dns.providers.porkbun

  arm64-runtime:
    name: arm64-runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # official Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # official Node 24
        with:
          go-version: '1.27.4'
          cache: true
      - name: Verify native ARM64 runner and run isolated Caddy Go tests
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          CGO_ENABLED=0 go test -count=1 ./...
      - name: Build and execute native ARM64 Linux Gateway
        env:
          GATEWAY_SMOKE_EXPECTED_VERSION: 0.1.0-ci-arm64
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/GoreeCloud/gateway/internal/gateway.Version=0.1.0-ci-arm64" -o gateway .
          file gateway | grep -E 'ELF 64-bit.*aarch64|ELF 64-bit.*ARM aarch64'
          go version -m gateway | grep -F 'GOARCH=arm64'
          ./gateway list-modules | grep -F http.handlers.reverse_proxy
          ./gateway list-modules | grep -F dns.providers.porkbun
          bash scripts/ci_native_loopback_smoke.sh
