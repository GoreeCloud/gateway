name: Gateway Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Unit test
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify development APK and create SHA-256 manifest
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          (cd "$(dirname "$apk")" && sha256sum app-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Preserve debug APK for local device testing
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-gateway-debug-test-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      # GitHub test artifacts are NOT production release deliverables.
      # The authorized standalone APK destination is GoreeCloud/Artifacts on Drive.
