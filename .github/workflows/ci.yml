name: Gateway CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve pinned modules
        run: go mod tidy
      - name: Verify dependency checksums
        run: go mod verify
      - name: Format
        run: test -z "$(gofmt -l cmd modules)"
      - name: Validate read-only ingress diagnostic syntax
        run: bash -n scripts/inspect_legacy_ingress.sh
      - name: Validate web client syntax
        run: node --check cmd/console/web/app.js
      - name: Test confidential-safe Caddyfile counter
        run: |
          python3 -m unittest discover -s scripts -p 'test_caddyfile_inventory.py' -v
          python3 scripts/caddyfile_inventory.py configs/LegacyMigration.example > /tmp/legacy-inventory.json
          python3 -c 'import json; x=json.load(open("/tmp/legacy-inventory.json")); assert x["porkbun_dns_directives"] == 1 and x["directives"]["reverse_proxy"] == 2 and x["directives"]["basic_auth"] == 1'
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o gateway ./cmd/gateway
      - name: Build console
        run: go build -trimpath -o gateway-console ./cmd/console
      - name: Adapt synthetic legacy Caddyfile without DNS requests
        run: |
          GC_TEST_BCRYPT="$(./gateway hash-password --plaintext 'synthetic-fixture-only')"
          export GC_TEST_BCRYPT
          ./gateway adapt --config configs/LegacyMigration.example --adapter caddyfile > /tmp/gateway-legacy-adapted.json
          python3 - <<'PY'
          import json
          from collections import Counter
          data = json.load(open("/tmp/gateway-legacy-adapted.json"))
          handlers = Counter()
          def visit(value):
              if isinstance(value, dict):
                  if isinstance(value.get("handler"), str):
                      handlers[value["handler"]] += 1
                  for item in value.values():
                      visit(item)
              elif isinstance(value, list):
                  for item in value:
                      visit(item)
          visit(data)
          assert handlers["reverse_proxy"] == 2, handlers
          assert handlers["authentication"] >= 1, handlers
          assert "porkbun" in json.dumps(data), "Porkbun DNS provider missing from adapted config"
          PY
      - name: Smoke test protected console API
        run: |
          token="$(openssl rand -hex 32)"
          GOREE_GATEWAY_CONSOLE_TOKEN="$token" ./gateway-console > /tmp/gateway-console-smoke.log 2>&1 &
          console_pid=$!
          trap 'kill "$console_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:7689/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/gateway-console-smoke.log
            exit 1
          fi
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:7689/api/v1/overview)"
          test "$code" = 401
          curl --silent --show-error --fail --header "Authorization: Bearer $token" http://127.0.0.1:7689/api/v1/overview |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["api_version"]=="v1" and x["state"]=="unreachable" and "routes" not in x'
          curl --silent --show-error --fail http://127.0.0.1:7689/ | grep -q 'GoreeCloud Gateway'
      - name: Validate sample config
        run: ./gateway validate --config configs/Gatewayfile.example --adapter caddyfile
      - name: Loopback smoke test
        run: |
          ./gateway run --config configs/Gatewayfile.example --adapter caddyfile > gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat gateway.log; exit 1; fi
          curl --silent --show-error --fail --dump-header /tmp/gateway-headers -o /dev/null http://127.0.0.1:8080/
          grep -Eiq '^X-Request-Id: [0-9a-f]{32}' /tmp/gateway-headers
          grep -Eiq '^X-Frame-Options: DENY' /tmp/gateway-headers
          grep -Eiq '^X-Content-Type-Options: nosniff' /tmp/gateway-headers
          curl --silent --show-error --fail http://127.0.0.1:8080/internal/test | grep -q 'private route'
      - name: Adapt Porkbun DNS challenge example without contacting DNS
        run: |
          ./gateway adapt --config configs/Porkbunfile.example --adapter caddyfile > /tmp/gateway-porkbun-adapted.json
          python3 -c 'import json; d=json.load(open("/tmp/gateway-porkbun-adapted.json")); assert "porkbun" in json.dumps(d)'
      - name: Check registered modules
        run: |
          ./gateway list-modules | grep -q 'http.handlers.goree_request_id'
          ./gateway list-modules | grep -q 'http.handlers.goree_security_headers'
          ./gateway list-modules | grep -q 'http.handlers.goree_ip_allowlist'
          ./gateway list-modules | grep -q 'dns.providers.porkbun'
