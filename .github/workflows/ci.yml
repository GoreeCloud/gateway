name: Gateway CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build web console
        run: npm ci --prefix web --ignore-scripts && npm run build --prefix web
      - name: Audit pinned web dependencies
        run: npm audit --prefix web --audit-level=high
      - name: Redacted preflight synthetic tests (no Docker contact)
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests and vet
        run: go test -count=1 ./... && go vet ./...
      - name: Native build
        run: CGO_ENABLED=0 go build -trimpath -o gateway .
      - name: Confirm Caddy modules are available
        run: |
          ./gateway list-modules | grep -F http.handlers.reverse_proxy
          ./gateway list-modules | grep -F dns.providers.porkbun
