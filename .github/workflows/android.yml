name: Gateway Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Unit test
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      # APK publication intentionally omitted. GoreeCloud requires standalone APK
      # delivery to its authorized Google Drive Artifacts directory after review.
