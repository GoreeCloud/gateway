# Review-only dependency update proposals. No automatic merges or deployments.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:17"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "10:37"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "10:47"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2
