name: Gateway Native Foundation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOREECLOUD_GATEWAY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  foundation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GOREECLOUD_GATEWAY_SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GOREECLOUD_GATEWAY_SOURCE_REVISION"
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Validate JSON syntax
        run: |
          python -m json.tool capabilities.json >/dev/null
          python -m json.tool config/gateway.schema.json >/dev/null
          python -m json.tool config/example.json >/dev/null
      - name: Validate Gateway Milestone 0 contract
        run: python3 scripts/validate_gateway_foundation.py
      - name: Validate Caddy VPS read-only preflight
        run: |
          bash -n deploy/vps/caddy-read-only-preflight.sh
          bash deploy/vps/caddy-read-only-preflight.sh --self-test

  proxy-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GOREECLOUD_GATEWAY_SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GOREECLOUD_GATEWAY_SOURCE_REVISION"
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Gateway
        run: go build ./cmd/gateway
